services:
  nexus-hub:
    url: http://localhost:8090
    path: /nexushub/**
    publicEndpoints:
      - /api/v1/organizations/register
      - /api/v1/auth/login
      - /api/v1/auth/refresh

management:
  enabled: true
  basePath: /management
  targetPath: /actuator
  endpoints:
    - health


security:
  enabled: true
  jwt:
    enabled: true
    algorithm: HS256
    identityClaim: userid

    verification:
      type: shared-secret
      secret: ${JWT_SECRET}

    issuer: http://localhost:8090
    audience: nexushub

rateLimit:
  enabled: true
  redisFailureStrategy: fail-open
  redisTimeoutMs: 1000

  outer:
    enabled: true
    algorithm: token-bucket
    capacity: 100
    refillRate: 100
    refillPeriodSeconds: 60

  inner:
    enabled: false
    algorithm: token-bucket
    capacity: 60
    refillRate: 60
    refillPeriodSeconds: 60


logging:
  enabled: true
  fields:
    duration: false

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}

monitoring:
  enabled: true
